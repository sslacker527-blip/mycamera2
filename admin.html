<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — mycamera</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}h1{margin-top:0}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0000000d}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button,.btn{border:0;border-radius:8px;background:#7e22ce;color:white;padding:11px 15px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;margin:3px}button.danger{background:#b91c1c}button.secondary{background:#475569}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.item{border-top:1px solid #e5e7eb;padding:14px 0}.msg{padding:10px;border-radius:8px;background:#fef3c7;margin:10px 0}.small{color:#64748b;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a href="/" class="btn secondary">← მაღაზიაში დაბრუნება</a><h1>mycamera — Admin</h1>
<div id="login" class="panel"><h2>ადმინისტრატორის შესვლა</h2><label>პაროლი</label><input id="password" type="password" autocomplete="current-password" placeholder="შეიყვანე Admin პაროლი"><button id="loginBtn">შესვლა</button><div id="loginMsg" class="msg hidden"></div><p class="small">პაროლი სერვერზე მოწმდება და HTML ფაილში არ ინახება.</p></div>
<div id="dashboard" class="hidden"><div class="panel"><button id="logout" class="secondary">გასვლა</button><h2>პროდუქტის დამატება / რედაქტირება</h2><input id="pid" type="hidden"><label>პროდუქტის სახელი</label><input id="name" placeholder="მაგ. 4G PTZ კამერა"><div class="grid"><div><label>ფასი (₾)</label><input id="price" type="number" min="0"></div><div><label>კატეგორია</label><select id="category"><option>4G</option><option>Wi-Fi</option></select></div></div><label>ფოტოს მისამართი (URL ან ფაილის სახელი)</label><input id="image" placeholder="camera-4g.jpg"><label>აღწერა</label><textarea id="description" rows="3"></textarea><button id="saveProduct">პროდუქტის შენახვა</button><button id="clearForm" class="secondary">გასუფთავება</button><div id="productMsg" class="msg hidden"></div></div>
<div class="panel"><h2>პროდუქტები</h2><div id="productList">იტვირთება…</div></div><div class="panel"><h2>შეკვეთები</h2><button id="refreshOrders" class="secondary">განახლება</button><div id="ordersList">იტვირთება…</div></div></div></main>
<script>
let token='';
const $=id=>document.getElementById(id);
function msg(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}const r=await fetch('/.netlify/functions/'+path,opts);const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'შეცდომა');return data}
async function loadAll(){await loadProducts();await loadOrders()}
$('loginBtn').onclick=async()=>{try{const data=await api('auth',{method:'POST',body:{password:$('password').value}});token=data.token;sessionStorage.setItem('mycameraAdminToken',token);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadAll()}catch(e){msg('loginMsg','პაროლი არასწორია ან სერვერის კონფიგურაცია არ არის დასრულებული. '+e.message)}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=()=>{token='';sessionStorage.removeItem('mycameraAdminToken');$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
function clearForm(){['pid','name','price','image','description'].forEach(id=>$(id).value='');$('category').value='4G'}
$('clearForm').onclick=clearForm;
$('saveProduct').onclick=async()=>{try{const b={id:$('pid').value||undefined,name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,image:$('image').value.trim(),description:$('description').value.trim()};if(!b.name||!Number.isFinite(b.price))throw Error('შეავსე სახელი და ფასი');await api('products',{method:b.id?'PUT':'POST',body:b});msg('productMsg','პროდუქტი შენახულია');clearForm();await loadProducts()}catch(e){msg('productMsg',e.message)}};
async function loadProducts(){try{const ps=await api('products');$('productList').innerHTML=ps.length?ps.map(p=>`<div class="item"><b>${safe(p.name)}</b> — ${safe(p.price)} ₾ <span class="small">(${safe(p.category)})</span><br>${safe(p.description||'')}<br><button onclick="editProduct('${p.id}')">რედაქტირება</button><button class="danger" onclick="deleteProduct('${p.id}')">წაშლა</button></div>`).join(''):'პროდუქტები ჯერ არ არის.';window.__products=ps}catch(e){$('productList').textContent=e.message}}
window.editProduct=id=>{const p=(window.__products||[]).find(x=>x.id===id);if(!p)return;$('pid').value=p.id;$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('image').value=p.image||'';$('description').value=p.description||'';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('წავშალოთ პროდუქტი?'))return;try{await api('products?id='+encodeURIComponent(id),{method:'DELETE'});await loadProducts()}catch(e){alert(e.message)}};
async function loadOrders(){try{const os=await api('orders');$('ordersList').innerHTML=os.length?os.map(o=>`<div class="item"><b>${safe(o.name||'')}</b> — ${safe(o.phone||'')}<br><span class="small">${safe(o.createdAt||'')}</span><p>${safe(JSON.stringify(o.items||[]))}</p><label>სტატუსი</label><select id="status-${o.id}"><option ${o.status==='ახალი'?'selected':''}>ახალი</option><option ${o.status==='მუშავდება'?'selected':''}>მუშავდება</option><option ${o.status==='გაგზავნილია'?'selected':''}>გაგზავნილია</option><option ${o.status==='დასრულებულია'?'selected':''}>დასრულებულია</option></select><button onclick="updateOrder('${o.id}')">სტატუსის შენახვა</button><button class="danger" onclick="deleteOrder('${o.id}')">წაშლა</button></div>`).join(''):'შეკვეთები ჯერ არ არის.';window.__orders=os}catch(e){$('ordersList').textContent=e.message}}
window.updateOrder=async id=>{try{await api('orders',{method:'PUT',body:{id,status:$('status-'+id).value}});await loadOrders()}catch(e){alert(e.message)}};
window.deleteOrder=async id=>{if(!confirm('წავშალოთ შეკვეთა?'))return;try{await api('orders?id='+encodeURIComponent(id),{method:'DELETE'});await loadOrders()}catch(e){alert(e.message)}};
$('refreshOrders').onclick=loadOrders;
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
token=sessionStorage.getItem('mycameraAdminToken')||'';if(token){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadAll()}
</script></body></html>
